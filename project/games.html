<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse and filter video games by genre, platform, and rating with NextPlay Gaming Guide.">
    <meta name="author" content="Hania Flores">
    <title>NextPlay Gaming Guide | Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/nextplay.css">
    <script src="scripts/main.js" defer></script>
    <script src="scripts/game-data.js" defer></script>
    <script src="scripts/games.js" defer></script>
</head>

<body>

<a class="skip-link" href="#main-content">Skip to main content</a>


<header class="site-header">

    <div class="container header-container">

        <a class="brand" href="index.html">

            <img
                src="images/logo.svg"
                alt="NextPlay game controller logo"
                class="logo"
                width="60"
                height="60"
            >

            <div class="brand-text">
                <span class="brand-name">NextPlay</span>
                <span class="brand-subtitle">Gaming Guide</span>
            </div>

        </a>


        <button
            id="menu-button"
            class="menu-button"
            type="button"
            aria-label="Open navigation menu"
            aria-controls="primary-nav"
            aria-expanded="false"
        >
            ☰
        </button>


        <nav id="primary-nav" class="primary-nav">

            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="games.html" aria-current="page">Games</a>
                </li>

                <li>
                    <a href="recommendations.html">Recommendations</a>
                </li>

                <li>
                    <a href="references.html">References</a>
                </li>
            </ul>

        </nav>

    </div>

</header>


<main id="main-content">

    <section class="page-banner">

        <div class="container">

            <p class="eyebrow">GAME LIBRARY</p>

            <h1>Find Your Next Game</h1>

            <p>
                Filter the collection by genre, platform, or rating.
            </p>

        </div>

    </section>


    <section class="section">

        <div class="container">

            <div class="filter-panel">

                <div class="filter-group">

                    <label for="genre-filter">
                        Genre
                    </label>

                    <select id="genre-filter">
                        <option value="all">All Genres</option>
                        <option value="Action">Action</option>
                        <option value="Adventure">Adventure</option>
                        <option value="Racing">Racing</option>
                        <option value="RPG">RPG</option>
                        <option value="Simulation">Simulation</option>
                        <option value="Sports">Sports</option>
                    </select>

                </div>


                <div class="filter-group">

                    <label for="platform-filter">
                        Platform
                    </label>

                    <select id="platform-filter">
                        <option value="all">All Platforms</option>
                        <option value="PC">PC</option>
                        <option value="Xbox">Xbox</option>
                        <option value="PlayStation">PlayStation</option>
                        <option value="Nintendo">Nintendo</option>
                    </select>

                </div>


                <div class="filter-group">

                    <label for="rating-filter">
                        Minimum Rating
                    </label>

                    <select id="rating-filter">
                        <option value="0">All Ratings</option>
                        <option value="7">7+</option>
                        <option value="8">8+</option>
                        <option value="9">9+</option>
                    </select>

                </div>

            </div>


            <div class="results-header">

                <h2>Games</h2>

                <p id="game-count"></p>

            </div>


            <p
                id="game-message"
                class="status-message"
                aria-live="polite"
            ></p>


            <div
                id="game-list"
                class="game-grid"
            ></div>

        </div>

    </section>

</main>


<footer class="site-footer">

    <div class="container footer-container">

        <p>
            &copy;
            <span id="currentyear"></span>
            Hania Flores | Mexico
        </p>

        <p>
            Last Modification:
            <span id="lastModified"></span>
        </p>

        <p>
            <a href="references.html">References</a>
        </p>

    </div>

</footer>

</body>
</html>
