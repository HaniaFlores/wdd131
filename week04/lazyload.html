<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Load Example</title>
    <meta name="description" content="Lazy loading learning activity example page">
    <meta name="author" content="Hania Flores">
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>
<body>
    <header>
        <h1>Lazy Load Example</h1>
    </header>
    <main>
        <picture>
            <img src="https://picsum.photos/400/600" alt="Placeholder Image" width="400" height="600" loading="lazy">
        </picture>
        <picture>
            <img src="https://picsum.photos/400/700" alt="Placeholder Image" width="400" height="700" loading="lazy">
        </picture>
        <picture>
            <img src="https://picsum.photos/400/800" alt="Placeholder Image" width="400" height="800" loading="lazy">
        </picture>
        <picture>
            <img src="https://picsum.photos/400/900" alt="Placeholder Image" width="400" height="900" loading="lazy">
        </picture>
        <picture>
            <img src="https://picsum.photos/400/1000" alt="Placeholder Image" width="400" height="1000" loading="lazy">
        </picture>
        <picture>
            <img src="https://picsum.photos/400/1100" alt="Placeholder Image" width="400" height="1100" loading="lazy">
        </picture>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> | Hania Flores | Mexico</p>
        <p> Last Modification: <span id="lastmodified"></span></p>
    </footer>
</body>
</html>
