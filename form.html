<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="Product review form for WDD 131">
    <meta name="author" content="Hania Flores">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form method="get" action="review.html">
      <label for="product">Product Name</label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <fieldset class="rating">
        <legend>Overall Rating</legend>

        <div class="rating-options">
          <label for="rating1">
            <span>☆</span>
            <input type="radio" id="rating1" name="rating" value="1" required>
          </label>

          <label for="rating2">
            <span>☆☆</span>
            <input type="radio" id="rating2" name="rating" value="2" required>
          </label>

          <label for="rating3">
            <span>☆☆☆</span>
            <input type="radio" id="rating3" name="rating" value="3" required>
          </label>

          <label for="rating4">
            <span>☆☆☆☆</span>
            <input type="radio" id="rating4" name="rating" value="4" required>
          </label>

          <label for="rating5">
            <span>☆☆☆☆☆</span>
            <input type="radio" id="rating5" name="rating" value="5" required>
          </label>
        </div>
      </fieldset>

      <label for="install-date">Date of Installation</label>
      <input type="date" id="install-date" name="install-date" required>

      <fieldset class="features">
        <legend>
          Which features did you find useful in the product?
          <span>(Check all that apply)</span>
        </legend>

        <label for="durability">
          <input type="checkbox" id="durability" name="features" value="durability">
          Durability
        </label>

        <label for="ease-of-use">
          <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
          Ease of Use
        </label>

        <label for="performance">
          <input type="checkbox" id="performance" name="features" value="performance">
          Performance
        </label>

        <label for="design">
          <input type="checkbox" id="design" name="features" value="design">
          Design
        </label>
      </fieldset>

      <label for="review">
        Written Review <span class="optional">(Optional)</span>
      </label>
      <textarea id="review" name="review" rows="7"></textarea>

      <label for="username">
        Your Name <span class="optional">(Optional)</span>
      </label>
      <input type="text" id="username" name="username">

      <input type="submit" value="Post Review">
    </form>
  </main>

  <footer>
        <p>&copy; <span id="currentyear"></span> | Hania Flores | Mexico</p>
        <p> Last Modification: <span id="lastmodified"></span></p>
    </footer>
</body>
</html>
